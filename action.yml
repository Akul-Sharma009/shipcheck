name: ShipCheck
description: Judge this repo against a hackathon's rules with NVIDIA Nemotron on Nebius Token Factory.
inputs:
  hackathon-url:
    description: Hackathon page (Devpost URL).
    required: true
  repo:
    description: Repo URL to check.
    default: ${{ github.server_url }}/${{ github.repository }}
  ref:
    description: Commit SHA to check (on pull requests, the PR's head commit).
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  fail-on:
    description: "Fail the job on: fail (default), unclear (fail or unclear), never."
    default: fail
  nebius-api-key:
    description: Nebius Token Factory API key.
    required: true
  tavily-api-key:
    description: Tavily key. Only needed for hackathons whose rules are not bundled in the action.
    required: false
    default: ""
  github-token:
    description: Token used to read the repo, and to comment on pull requests.
    default: ${{ github.token }}
  comment-on-pr:
    description: "On pull_request events, post the report as a PR comment, updated in place on each run (true/false). Needs permissions: pull-requests: write."
    default: "true"
outputs:
  pass:
    description: Number of requirements that pass.
    value: ${{ steps.check.outputs.pass }}
  fail:
    description: Number of requirements that fail.
    value: ${{ steps.check.outputs.fail }}
  unclear:
    description: Number of requirements that are unclear.
    value: ${{ steps.check.outputs.unclear }}
  report-path:
    description: Path of the Markdown report on the runner.
    value: ${{ steps.check.outputs.report-path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"
    - name: Run ShipCheck
      id: check
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        NEBIUS_API_KEY: ${{ inputs.nebius-api-key }}
        TAVILY_API_KEY: ${{ inputs.tavily-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HACKATHON_URL: ${{ inputs.hackathon-url }}
        REPO_URL: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        REPORT="${RUNNER_TEMP}/shipcheck-report.md"
        echo "report-path=${REPORT}" >> "$GITHUB_OUTPUT"
        set +e
        python -m shipcheck.cli "$HACKATHON_URL" "$REPO_URL" --ref "$REF" --markdown "$REPORT" --fail-on "$FAIL_ON"
        code=$?
        [ -f "$REPORT" ] && cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        exit $code
    - name: Comment on the pull request
      if: always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        REPORT: ${{ steps.check.outputs.report-path }}
      run: |
        if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
          echo "::warning::No ShipCheck report to comment with"; exit 0
        fi
        # A fork's PR gets a read-only token: warn instead of failing the job.
        "${{ github.action_path }}/scripts/pr_comment.sh" "$REPORT" "$PR" "$REPO" \
          || echo "::warning::Couldn't comment on the PR (the token needs pull-requests: write; forks get read-only tokens)"
