name: ShipCheck (self)
# Manual only: needs the NEBIUS_API_KEY secret, and each run costs Token Factory credits.
on:
  workflow_dispatch:
jobs:
  shipcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          hackathon-url: https://nebiusglobalaihackathon.devpost.com/
          fail-on: never
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
